<template data-sly-template.simple="${ @ container}">
    <div id="${container.id}"
         class="cmp-container"
         aria-label="${container.accessibilityLabel}"
         role="${container.roleAttribute}"
         style="${container.backgroundStyle @ context='styleString'}">
        <sly data-sly-set.items="${container.children || container.items}"
             data-sly-repeat="${items}" 
             data-sly-resource="${item.resource || item.path @ decoration=true}"></sly>
        <sly data-sly-test="${!wcmmode.disabled}">
            <div class="new section">
                <sly data-sly-resource="${resource.path @ resourceType='wcm/foundation/components/parsys/newpar', appendPath='/*'}"/>
            </div>
        </sly>
    </div>
</template>
