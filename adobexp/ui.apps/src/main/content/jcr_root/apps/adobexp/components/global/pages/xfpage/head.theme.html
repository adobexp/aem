<!--/* 
    Template for including site theme CSS variables via SiteThemeServlet.
    The servlet generates CSS from Context-Aware Configuration at runtime.
    
    Cache-busting: The ThemeVersionModel generates a hash from all CA config values.
    When any configuration changes, the hash changes, generating a new URL that
    bypasses CDN cache automatically. Works on both AEMaaCS and On-Premise AEM.
    
    URL format: /content/site/page.theme-variables.<version-hash>.css
    Example:    /content/site/home.theme-variables.a1b2c3d4.css
*/-->
<template data-sly-template.themeStyles
          data-sly-use.themeVersion="com.adobexp.aem.core.components.internal.models.ThemeVersionModel"
          data-sly-use.themeBase="${'adobexp/components/commons/v1/helper/transformurls.js' @ internalUrl=currentPage.path}">
    <link rel="stylesheet" href="${themeBase}.theme-variables.${themeVersion.version}.css" type="text/css">
</template>
