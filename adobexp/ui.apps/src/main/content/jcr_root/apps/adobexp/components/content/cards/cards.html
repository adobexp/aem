<!--/*
    Cards Component - AEM Sightly Template

    Renders a feature card grid with:
    - Optional section title and subtitle
    - Configurable 2/3/4 column grid
    - Card items with icon, title, and description

    Note: Theme (dark/light) is controlled via page template, not this component.
*/-->

<sly data-sly-use.templates="adobexp/components/commons/v1/templates.html"/>
<sly data-sly-use.cards="com.adobexp.aem.core.components.models.CardsModel"/>

<!-- CARDS COMPONENT HTML MARKUP STARTS HERE -->
<section class="cards ${cards.variant}"
         data-component="cards"
         aria-label="${cards.title || 'Cards'}"
         data-sly-test="${cards.hasContent}">
    <div class="cards__inner">
        <div class="cards__header" data-sly-test="${cards.title || cards.subtitle}">
            <h2 class="cards__title" data-sly-test="${cards.title}">${cards.title}</h2>
            <p class="cards__subtitle" data-sly-test="${cards.subtitle}">${cards.subtitle}</p>
        </div>
        <div class="cards__grid ${cards.gridClass}" data-sly-test="${cards.hasCards}">
            <sly data-sly-list.item="${cards.cardItems}">
                <article class="cards__item">
                    <span class="cards__item-icon" aria-hidden="true" data-sly-test="${item.icon}">${item.icon}</span>
                    <h3 class="cards__item-title" data-sly-test="${item.itemTitle}">${item.itemTitle @ context='html'}</h3>
                    <div class="cards__item-desc" data-sly-test="${item.description}">${item.description @ context='html'}</div>
                </article>
            </sly>
        </div>
    </div>
</section>
<!-- CARDS COMPONENT HTML MARKUP ENDS HERE -->

<sly data-sly-call="${templates.placeholder @ isEmpty = !cards.hasContent, classAppend='cards'}"></sly>
