<!--/*
    Form Builder - Hidden Text Field Component
    Renders a hidden input that submits a name/value pair with the form.
    Shows a visual placeholder in AEM author edit mode for easy identification.
*/-->

<div class="form-builder__field form-builder__field--hidden"
     data-sly-test="${properties.fieldName || wcmmode.edit}">
    <input 
        type="hidden" 
        name="${properties.fieldName}" 
        value="${properties.fieldValue}" 
        class="form-builder__hidden-input">
    <sly data-sly-test="${wcmmode.edit}">
        <div class="form-builder__hidden-placeholder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
            <span data-sly-test="${properties.fieldName}">Hidden Field: <strong>${properties.fieldName}</strong> = <em>${properties.fieldValue}</em></span>
            <span data-sly-test="${!properties.fieldName}">Hidden Text Field — <em>please configure field name and value</em></span>
        </div>
    </sly>
</div>
